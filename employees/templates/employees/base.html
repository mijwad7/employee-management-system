<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Management{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #64748b;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --radius: 0.5rem;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .container {
            width: 100%;
        }

        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            display: inline-block;
            text-align: center;
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            font-size: 0.875rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            color: white;
        }

        .btn-secondary {
            background-color: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--background);
            color: var(--text-main);
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            width: auto;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        .success-msg {
            color: var(--success);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        /* Flex Utils */
        .flex {
            display: flex;
        }

        .justify-between {
            justify-content: space-between;
        }

        .items-center {
            align-items: center;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <!-- Global Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="confirm-title" style="margin-bottom: 0.5rem;">Confirm Action</h3>
            <p id="confirm-message" style="color: var(--text-muted);">Are you sure?</p>
            <div class="modal-actions">
                <button id="confirm-cancel" class="btn btn-secondary" style="width: auto;">Cancel</button>
                <button id="confirm-ok" class="btn"
                    style="width: auto; background-color: var(--danger);">Confirm</button>
            </div>
        </div>
    </div>

    <header>
        <h1>EMS</h1>
        <nav id="nav-links">
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        const token = localStorage.getItem('access_token');
        const nav = document.getElementById('nav-links');

        function showToast(message, type = 'info') {
            let bgStr = "#4f46e5";
            if (type === 'error') bgStr = "#ef4444";
            if (type === 'success') bgStr = "#22c55e";

            Toastify({
                text: message,
                duration: 3000,
                close: true,
                gravity: "top",
                position: "right",
                backgroundColor: bgStr,
                stopOnFocus: true,
            }).showToast();
        }

        function showConfirm(message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const msgEl = document.getElementById('confirm-message');
            const okBtn = document.getElementById('confirm-ok');
            const cancelBtn = document.getElementById('confirm-cancel');

            msgEl.textContent = message;
            modal.classList.add('active');

            const newOk = okBtn.cloneNode(true);
            const newCancel = cancelBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOk, okBtn);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

            newOk.addEventListener('click', () => {
                modal.classList.remove('active');
                onConfirm();
            });

            newCancel.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.onclick = (e) => {
                if (e.target === modal) modal.classList.remove('active');
            };
        }

        if (token) {
            nav.innerHTML = `
                <a href="/employees/">Employees</a>
                <a href="/form-builder/">Form Builder</a>
                <a href="/profile/">Profile</a>
                <a href="#" id="logout-btn">Logout</a>
            `;
            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login/';
            });

            axios.interceptors.request.use(function (config) {
                const currentToken = localStorage.getItem('access_token');
                if (currentToken) {
                    config.headers.Authorization = 'Bearer ' + currentToken;
                }
                return config;
            }, function (error) {
                return Promise.reject(error);
            });

            axios.interceptors.response.use(function (response) {
                return response;
            }, async function (error) {
                const originalRequest = error.config;

                if (error.response && error.response.status === 401 && !originalRequest._retry) {
                    originalRequest._retry = true;
                    const refreshToken = localStorage.getItem('refresh_token');

                    if (refreshToken) {
                        try {
                            const res = await axios.post('/api/token/refresh/', {
                                refresh: refreshToken
                            });

                            if (res.status === 200) {
                                localStorage.setItem('access_token', res.data.access);
                                axios.defaults.headers.common['Authorization'] = 'Bearer ' + res.data.access;
                                originalRequest.headers['Authorization'] = 'Bearer ' + res.data.access;
                                return axios(originalRequest);
                            }
                        } catch (refreshError) {
                            console.error("Token refresh failed", refreshError);
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('refresh_token');
                            window.location.href = '/login/';
                        }
                    } else {
                        window.location.href = '/login/';
                    }
                }
                return Promise.reject(error);
            });

        } else {
            nav.innerHTML = `
                <a href="/login/">Login</a>
                <a href="/register/">Register</a>
            `;
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
