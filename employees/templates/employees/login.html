{% extends 'employees/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>
    <div id="message" class="error-msg"></div>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: var(--text-muted);">
        Don't have an account? <a href="/register/"
            style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const message = document.getElementById('message');

        try {
            const response = await axios.post('/api/login/', {
                username: username,
                password: password
            });

            localStorage.setItem('access_token', response.data.access);
            localStorage.setItem('refresh_token', response.data.refresh);

            window.location.href = '/profile/';

        } catch (error) {
            console.error(error);
            if (error.response && error.response.data && error.response.data.detail) {
                message.textContent = error.response.data.detail;
            } else {
                message.textContent = 'Login failed. Please check your credentials.';
            }
        }
    });
</script>
{% endblock %}
