{% extends 'employees/base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Register</h2>
    <div id="message" class="error-msg"></div>
    <form id="register-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password" required>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: var(--text-muted);">
        Already have an account? <a href="/login/"
            style="color: var(--primary); font-weight: 600; text-decoration: none;">Login here</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const password_confirm = document.getElementById('password_confirm').value;
        const message = document.getElementById('message');

        if (password !== password_confirm) {
            message.textContent = "Passwords do not match!";
            return;
        }

        try {
            const response = await axios.post('/api/register/', {
                username: username,
                email: email,
                password: password,
                password_confirm: password_confirm
            });

            message.className = 'success-msg';
            message.textContent = 'Registration successful! Redirecting to login...';
            setTimeout(() => {
                window.location.href = '/login/';
            }, 1000);

        } catch (error) {
            console.error(error);
            if (error.response && error.response.data) {
                let errorMsg = '';
                for (const [key, value] of Object.entries(error.response.data)) {
                    errorMsg += `${key}: ${value} `;
                }
                message.className = 'error-msg';
                message.textContent = errorMsg || 'Registration failed.';
            } else {
                message.className = 'error-msg';
                message.textContent = 'Registration failed. Please try again.';
            }
        }
    });
</script>
{% endblock %}
